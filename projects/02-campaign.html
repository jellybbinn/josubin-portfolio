</head>
<body>
  <nav id="nav">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="../index.html#hero" class="nav-logo-link">
          <img src="../assets/home.png" alt="J:D" class="nav-logo-img" />
        </a>

      </div>
      <ul class="nav-links">
        <li><a href="../index.html#projects" class="nav-btn">PROJECTS</a></li>
        <li><a href="../index.html#about"    class="nav-btn">ABOUT</a></li>

  <a href="../index.html#projects" class="back-btn">
    <img src="../assets/back_기본.png" alt="BACK" class="back-img back-default" />
    <img src="../assets/back_오버.png" alt="BACK" class="back-img back-hover" />
  </a>

  <script>
    function alignBackBtn() {
      var contact = document.querySelector('.nav-links li:last-child .nav-btn');
      var backBtn = document.querySelector('.back-btn');
      if (contact && backBtn) {
        var rect = contact.getBoundingClientRect();
        backBtn.style.right = (window.innerWidth - rect.right) + 'px';
      }
    }
    window.addEventListener('load', alignBackBtn);
    window.addEventListener('resize', alignBackBtn);
  </script>
